<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reiniciando sessão - Alemão ERP</title><style>body{margin:0;font-family:Arial,sans-serif;background:#1f2937;color:#fff;min-height:100vh;display:grid;place-items:center}.box{background:#fff;color:#172033;padding:28px;border-radius:14px;max-width:460px;margin:20px;text-align:center}p{color:#667085}</style></head><body><div class="box"><h2>🌭 Alemão Produtos da Roça</h2><p>Reiniciando sua sessão com segurança...</p><p id="status">Aguarde um instante.</p></div><script>try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&(k.startsWith('sb-')||k.startsWith('erp_')))localStorage.removeItem(k)}sessionStorage.clear();document.getElementById('status').textContent='Sessão limpa. Voltando para o login...';setTimeout(()=>location.replace('./?sessao=nova'),1200)}catch(e){document.getElementById('status').textContent='Não foi possível limpar automaticamente. Feche esta aba e abra o ERP novamente.'}</script></body></html>
