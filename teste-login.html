<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de acesso - Alemão ERP</title><style>body{font-family:Arial,sans-serif;background:#111827;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.box{background:#fff;border-radius:14px;padding:26px;width:min(460px,100%);box-sizing:border-box}input,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #d0d5dd}button{background:#1f2937;color:#fff;font-weight:700;cursor:pointer}.s{padding:10px;background:#f2f4f7;border-radius:8px;white-space:pre-wrap;margin:10px 0}.bad{color:#b42318}.ok{color:#067647}</style></head><body><div class="box"><h2>🌭 Teste de acesso ao ERP</h2><div id="s" class="s">Página de teste carregada. Informe e-mail e senha.</div><input id="e" type="email" placeholder="E-mail"><input id="p" type="password" placeholder="Senha"><button id="b" type="button">Testar login</button><button id="c" type="button">Limpar sessão local</button></div><script>const U='https://gtwvtgynnguiizepzfpu.supabase.co',K='sb_publishable_wM7la1ds3BUugE634awmHg_Tcpe4wF-',S=document.getElementById('s');function st(t,bad=false){S.textContent=t;S.className='s '+(bad?'bad':'ok')}document.getElementById('c').onclick=()=>{try{localStorage.clear();sessionStorage.clear()}catch(e){}st('Sessão local limpa. Agora teste o login.');};document.getElementById('b').onclick=async()=>{const email=document.getElementById('e').value.trim(),password=document.getElementById('p').value;if(!email||!password)return st('Preencha e-mail e senha.',true);st('1/2 Enviando login ao Supabase...');try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token)throw new Error((d.error_description||d.msg||d.message||('HTTP '+r.status)));st('2/2 LOGIN ACEITO. Testando acesso aos produtos...');const q=await fetch(U+'/rest/v1/products?select=id&limit=1',{headers:{apikey:K,Authorization:'Bearer '+d.access_token}});const t=await q.text();if(!q.ok)throw new Error('LOGIN OK, MAS BANCO FALHOU: '+t);localStorage.setItem('erp_access_token',d.access_token);localStorage.setItem('erp_user_email',d.user?.email||email);st('LOGIN E BANCO OK. Pode me mandar este print.');}catch(err){st('ERRO: '+(err?.message||String(err)),true)}};</script></body></html>
