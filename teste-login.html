rror)throw new Error('LOGIN: '+error.message);if(!data.session)throw new Error('LOGIN: sessão não retornada');st('2/3 Login aceito. Testando sessão...');const{data:u,error:ue}=await sb.auth.getUser();if(ue)throw new Error('SESSÃO: '+ue.message);st('3/3 Sessão válida para '+u.user.email+'. Testando banco...');const{data:rows,error:re}=await sb.from('products').select('id',{count:'exact',head:false}).limit(1);if(re)throw new Error('BANCO: '+re.message+' | código: '+(re.code||'-'));st('Tudo certo. Abrindo ERP...');setTimeout(()=>location.href='./',1200)}catch(err){st('ERRO\n'+(err?.message||String(err)),true)}};</script></body></html>
