<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha - Alemão ERP</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#374151);min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:#fff;border-radius:14px;padding:28px;box-sizing:border-box}h1{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#667085;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:8px;box-sizing:border-box}.btn{width:100%;border:0;border-radius:9px;padding:11px 14px;background:#1f2937;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.alt{background:#fff;color:#172033;border:1px solid #e5e7eb}.status{margin:10px 0;padding:10px;border-radius:9px;background:#f2f4f7}.bad{color:#b42318}.ok{color:#067647}.hidden{display:none}</style></head><body><div class="box"><h1>🌭 Alemão Produtos da Roça</h1><p>Recuperação de acesso ao ERP</p><div id="status" class="status">Informe o e-mail cadastrado.</div><div id="request"><div class="field"><label>E-mail</label><input id="email" type="email" value="igorthomazini@gmail.com"></div><button class="btn" id="send">Enviar link para redefinir senha</button><button class="btn alt" onclick="location.href='./'">Voltar ao login</button></div><div id="change" class="hidden"><div class="field"><label>Nova senha</label><input id="p1" type="password"></div><div class="field"><label>Confirmar nova senha</label><input id="p2" type="password"></div><button class="btn" id="save">Salvar nova senha</button></div></div><script>const U='https://gtwvtgynnguiizepzfpu.supabase.co',K='sb_publishable_wM7la1ds3BUugE634awmHg_Tcpe4wF-',S=document.getElementById('status'),hash=new URLSearchParams(location.hash.slice(1)),access=hash.get('access_token');function st(t,e=false){S.textContent=t;S.className='status '+(e?'bad':'ok')}if(access){document.getElementById('request').classList.add('hidden');document.getElementById('change').classList.remove('hidden');st('Digite sua nova senha.')}document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim();st('Enviando link...');try{const r=await fetch(U+'/auth/v1/recover',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,redirect_to:'https://alemao-erp.github.io/alemao-erp1/redefinir-senha.html'})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.message||'Não foi possível enviar.');st('Link enviado. Abra seu e-mail e clique no link de recuperação.')}catch(e){st('Erro: '+e.message,true)}};document.getElementById('save').onclick=async()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<6)return st('Use uma senha com pelo menos 6 caracteres.',true);if(a!==b)return st('As senhas não coincidem.',true);st('Salvando nova senha...');try{const r=await fetch(U+'/auth/v1/user',{method:'PUT',headers:{apikey:K,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({password:a})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.message||'Não foi possível alterar.');st('Senha alterada com sucesso. Voltando ao login...');setTimeout(()=>location.href='./',1500)}catch(e){st('Erro: '+e.message,true)}};</script></body></html>
