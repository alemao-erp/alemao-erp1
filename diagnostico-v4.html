<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico ERP V4</title><style>body{font-family:Arial,sans-serif;background:#f5f7fa;color:#172033;padding:24px}.box{max-width:760px;margin:auto;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px}.ok{color:#067647}.bad{color:#b42318}.item{padding:10px;border-radius:8px;background:#f2f4f7;margin:8px 0;white-space:pre-wrap}button{padding:10px 14px;border:0;border-radius:8px;background:#1f2937;color:#fff;font-weight:700;cursor:pointer}</style></head><body><div class="box"><h1>Diagnóstico ERP V4</h1><p>Esta página não altera nenhum dado. Ela apenas verifica por que a V4 não abre.</p><div id="out">Verificando...</div><button id="abrir" style="display:none">Abrir V4</button></div><script>const out=document.getElementById('out');function add(t,ok){const d=document.createElement('div');d.className='item '+(ok?'ok':'bad');d.textContent=(ok?'✅ ':'❌ ')+t;out.appendChild(d)};(async()=>{out.textContent='';try{const r=await fetch('./erp-v4.html?diag='+Date.now(),{cache:'no-store'});add('Arquivo V4 encontrado: HTTP '+r.status,r.ok);if(!r.ok)return;const html=await r.text();const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);add('Scripts encontrados: '+scripts.length,scripts.length>0);let syntaxOk=true;for(let i=0;i<scripts.length;i++){try{new Function(scripts[i]);add('JavaScript '+(i+1)+' sem erro de sintaxe.',true)}catch(e){syntaxOk=false;add('Erro de sintaxe no JavaScript '+(i+1)+': '+e.message,false)}}const ids=['login','app','loginForm','email','senha','loginStatus','msg','dashFrom','dashTo','repFrom','repTo','saleLines','purchaseLines','saleSearch','productSearch','clientSearch','cashForm','recvForm','payForm','applyDash','monthDash','applyReport'];const doc=new DOMParser().parseFromString(html,'text/html');const missing=ids.filter(id=>!doc.getElementById(id));add(missing.length?'IDs ausentes: '+missing.join(', '):'Elementos essenciais encontrados.',missing.length===0);if(syntaxOk&&missing.length===0){document.getElementById('abrir').style.display='inline-block';add('Estrutura básica aprovada. O próximo diagnóstico é de execução/sessão.',true)}}catch(e){add('Falha no diagnóstico: '+e.message,false)}})();document.getElementById('abrir').onclick=()=>location.href='./erp-v4.html?nocache='+Date.now();</script></body></html>
