<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alemão Produtos da Roça</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--pri:#1f2937;--acc:#b7791f;--ok:#067647;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#111827,#374151);padding:20px}.box,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.box{width:min(430px,100%);padding:28px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:8px}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--pri);color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.acc{background:var(--acc)}.status{margin:10px 0;padding:10px;border-radius:9px;background:#f2f4f7}.bad{color:var(--bad)}.ok{color:var(--ok)}.app{display:flex;min-height:100vh}.side{width:230px;background:var(--pri);color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:20px;font-weight:800}.brand small{display:block;font-size:12px;font-weight:400;opacity:.7;margin-top:4px}.nav{display:grid;gap:6px;margin-top:20px}.nav button{border:0;background:transparent;color:#fff;text-align:left;padding:11px;border-radius:8px;cursor:pointer}.nav button:hover{background:#374151}.main{margin-left:230px;padding:22px;width:calc(100% - 230px)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.card{padding:16px}.label{font-size:12px;color:var(--muted)}.value{font-size:22px;font-weight:800;margin-top:6px}.panel{padding:16px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.muted{color:var(--muted)}@media(max-width:760px){.side{width:72px}.brand{font-size:0}.brand:before{content:'🌭';font-size:28px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-left:72px;width:calc(100% - 72px);padding:14px}.cards,.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="box">
    <h1>🌭 Alemão Produtos da Roça</h1>
    <p class="muted">Gestão do negócio</p>
    <div id="loginStatus" class="status">Digite seu e-mail e senha.</div>
    <form id="loginForm">
      <div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="username"></div>
      <div class="field"><label>Senha</label><input id="senha" type="password" required autocomplete="current-password"></div>
      <button id="loginBtn" class="btn" style="width:100%;margin-top:8px">Entrar</button>
    </form>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="side">
    <div class="brand">Alemão Produtos da Roça<small>ERP do negócio</small></div>
    <div class="nav">
      <button data-page="dashboard">🏠 Dashboard</button>
      <button data-page="vendas">🧾 Vendas</button>
      <button data-page="produtos">🌭 Produtos</button>
    </div>
  </aside>
  <main class="main">
    <div class="top"><div><h1 id="title">Dashboard</h1><div id="userEmail" class="muted"></div></div><button id="logoutBtn" class="btn alt">Sair</button></div>
    <div id="appStatus" class="status hidden"></div>

    <section id="dashboard" class="page">
      <div class="cards">
        <div class="card"><div class="label">Vendas cadastradas</div><div id="kSales" class="value">—</div></div>
        <div class="card"><div class="label">Faturamento total</div><div id="kRevenue" class="value">—</div></div>
        <div class="card"><div class="label">Produtos cadastrados</div><div id="kProducts" class="value">—</div></div>
      </div>
      <div class="panel"><h3>Últimas vendas</h3><div id="recentSales"></div></div>
    </section>

    <section id="vendas" class="page hidden">
      <div class="panel">
        <h3>Nova venda</h3>
        <div class="grid">
          <div class="field"><label>Cliente</label><select id="saleClient"><option value="">Cliente balcão</option></select></div>
          <div class="field"><label>Pagamento</label><select id="salePayment"><option value="pix">Pix</option><option value="cash">Dinheiro</option><option value="debit">Débito</option><option value="credit">Crédito</option><option value="bank_transfer">Transferência</option><option value="other">Fiado/Outro</option></select></div>
          <div class="field"><label>Produto</label><select id="saleProduct"></select></div>
          <div class="field"><label>Quantidade</label><input id="saleQty" type="number" step="0.001" min="0.001" value="1"></div>
          <div class="field"><label>Preço unitário</label><input id="salePrice" type="number" step="0.01" min="0"></div>
          <div class="field"><label>Data da venda</label><input id="saleDate" type="date"></div>
        </div>
        <div class="row" style="margin-top:10px"><button id="saveSaleBtn" class="btn">Salvar venda</button><strong id="saleTotal">Total: R$ 0,00</strong></div>
      </div>
      <div class="panel"><h3>Histórico</h3><div id="salesTable"></div></div>
    </section>

    <section id="produtos" class="page hidden">
      <div class="panel"><h3>Produtos cadastrados</h3><div id="productsTable"></div></div>
    </section>
  </main>
</div>

<script>
const SUPABASE_URL='https://gtwvtgynnguiizepzfpu.supabase.co';
const API_KEY='sb_publishable_wM7la1ds3BUugE634awmHg_Tcpe4wF-';
const $=id=>document.getElementById(id);
let token=localStorage.getItem('erp_access_token')||'';
let userEmail=localStorage.getItem('erp_user_email')||'';
let products=[],clients=[],sales=[];
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(text,error=false){const el=$('appStatus');el.textContent=text;el.classList.remove('hidden');el.className='status '+(error?'bad':'ok');setTimeout(()=>el.classList.add('hidden'),7000)}
function authHeaders(extra={}){return {...extra,apikey:API_KEY,Authorization:'Bearer '+token};}
async function rest(table,query=''){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`,{headers:authHeaders({Accept:'application/json'})});if(!r.ok)throw new Error((await r.text())||('Erro '+r.status));return r.json();}
async function insert(table,row){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{method:'POST',headers:authHeaders({'Content-Type':'application/json',Prefer:'return=representation'}),body:JSON.stringify(row)});if(!r.ok)throw new Error((await r.text())||('Erro '+r.status));return r.json();}
async function patch(table,query,row){const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`,{method:'PATCH',headers:authHeaders({'Content-Type':'application/json',Prefer:'return=representation'}),body:JSON.stringify(row)});if(!r.ok)throw new Error((await r.text())||('Erro '+r.status));return r.json();}
async function login(e){e.preventDefault();const btn=$('loginBtn');btn.disabled=true;btn.textContent='Entrando...';$('loginStatus').textContent='Conectando ao sistema...';$('loginStatus').className='status';try{const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:API_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('senha').value})});const data=await r.json();if(!r.ok||!data.access_token)throw new Error(data.error_description||data.msg||data.message||'E-mail ou senha inválidos.');token=data.access_token;userEmail=data.user?.email||$('email').value.trim();localStorage.setItem('erp_access_token',token);localStorage.setItem('erp_user_email',userEmail);await openApp();}catch(err){$('loginStatus').textContent='Não foi possível entrar: '+err.message;$('loginStatus').className='status bad';}finally{btn.disabled=false;btn.textContent='Entrar';}}
async function validateSession(){if(!token)return false;try{const r=await fetch(`${SUPABASE_URL}/auth/v1/user`,{headers:authHeaders()});if(!r.ok)return false;const u=await r.json();userEmail=u.email||userEmail;return true;}catch{return false;}}
async function openApp(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userEmail').textContent=userEmail;await loadAll();show('dashboard'); }
function logout(){localStorage.removeItem('erp_access_token');localStorage.removeItem('erp_user_email');location.reload();}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');$('title').textContent={dashboard:'Dashboard',vendas:'Vendas',produtos:'Produtos'}[id]||id;}
async function loadAll(){try{[products,clients,sales]=await Promise.all([rest('products','?select=*&order=name.asc'),rest('clients','?select=*&order=name.asc'),rest('sales','?select=*&order=sold_at.desc')]);render();}catch(err){msg('Erro ao carregar dados: '+err.message,true);}}
function render(){
 $('kSales').textContent=sales.length;
 $('kRevenue').textContent=money(sales.reduce((a,s)=>a+Number(s.total||0),0));
 $('kProducts').textContent=products.length;
 $('saleClient').innerHTML='<option value="">Cliente balcão</option>'+clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
 $('saleProduct').innerHTML=products.map(p=>`<option value="${p.id}">${esc(p.name)} — estoque ${Number(p.stock||0)}</option>`).join('');
 const recent=sales.slice(0,8);$('recentSales').innerHTML=recent.length?recent.map(s=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${esc(s.client_name||'Cliente balcão')}</b> — ${money(s.total)} <span class="muted">${new Date(s.sold_at).toLocaleDateString('pt-BR')}</span></div>`).join(''):'<div class="muted">Nenhuma venda cadastrada.</div>';
 $('salesTable').innerHTML=sales.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Cliente</th><th>Pagamento</th><th>Total</th></tr></thead><tbody>${sales.map(s=>`<tr><td>${new Date(s.sold_at).toLocaleDateString('pt-BR')}</td><td>${esc(s.client_name||'Cliente balcão')}</td><td>${esc(s.payment_method||'-')}</td><td>${money(s.total)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">Nenhuma venda.</div>';
 $('productsTable').innerHTML=products.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Estoque</th><th>Custo</th><th>Preço</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category||'-')}</td><td>${Number(p.stock||0)}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">Nenhum produto.</div>';
 productChanged();
}
function productChanged(){const p=products.find(x=>String(x.id)===String($('saleProduct').value));if(p)$('salePrice').value=Number(p.price||0).toFixed(2);calcTotal();}
function calcTotal(){$('saleTotal').textContent='Total: '+money(Number($('saleQty').value||0)*Number($('salePrice').value||0));}
async function saveSale(){const btn=$('saveSaleBtn');const p=products.find(x=>String(x.id)===String($('saleProduct').value));if(!p)return msg('Selecione um produto.',true);const qty=Number($('saleQty').value||0),price=Number($('salePrice').value||0);if(qty<=0)return msg('Informe uma quantidade válida.',true);if(qty>Number(p.stock||0))return msg('Estoque insuficiente para '+p.name+'.',true);btn.disabled=true;btn.textContent='Salvando...';try{const cid=$('saleClient').value;const c=clients.find(x=>String(x.id)===String(cid));const date=$('saleDate').value||new Date().toISOString().slice(0,10);const soldAt=date+'T12:00:00-03:00';const total=qty*price,totalCost=qty*Number(p.cost||0);const created=await insert('sales',{client_id:cid||null,client_name:c?.name||'Cliente balcão',payment_method:$('salePayment').value,total,total_cost:totalCost,status:'completed',sold_at:soldAt});const sale=created[0];if(!sale)throw new Error('A venda não retornou identificação.');await insert('sale_items',{sale_id:sale.id,product_id:p.id,product_name:p.name,quantity:qty,unit_price:price,unit_cost:Number(p.cost||0),total,total_cost:totalCost,created_at:soldAt});await patch('products','?id=eq.'+encodeURIComponent(p.id),{stock:Number(p.stock||0)-qty});await insert('stock_moves',{product_id:p.id,move_type:'out',quantity:qty,reason:'Venda '+sale.id});if($('salePayment').value!=='other')await insert('cash_transactions',{type:'in',amount:total,description:'Venda '+sale.id,payment_method:$('salePayment').value,reference_id:sale.id,created_at:soldAt});msg('Venda salva com sucesso.');$('saleQty').value='1';await loadAll();show('vendas');}catch(err){msg('Erro ao salvar venda: '+err.message,true);}finally{btn.disabled=false;btn.textContent='Salvar venda';}}
$('loginForm').addEventListener('submit',login);$('logoutBtn').addEventListener('click',logout);document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.page)));$('saleProduct').addEventListener('change',productChanged);$('saleQty').addEventListener('input',calcTotal);$('salePrice').addEventListener('input',calcTotal);$('saveSaleBtn').addEventListener('click',saveSale);$('saleDate').value=new Date().toISOString().slice(0,10);
(async()=>{if(await validateSession())await openApp();else{localStorage.removeItem('erp_access_token');localStorage.removeItem('erp_user_email');}})();
</script>
</body>
</html>
