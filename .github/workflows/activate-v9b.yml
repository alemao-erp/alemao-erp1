name: Ativar V9 B
on:
  push:
    paths:
      - '.github/workflows/activate-v9b.yml'
jobs:
  activate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar entrada do aplicativo
        run: sed -i 's#./app-v8.js#./app-v9.js#g' index.html
      - name: Publicar
        run: |
          git config user.name 'alemao-erp'
          git config user.email 'igorthomazini@gmail.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: ativar dashboard inteligente v9'
          git push
