<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alemão Produtos da Roça - ERP Profissional</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;color:#172033;margin:0;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px;max-width:760px;width:calc(100% - 40px)}.ok{color:#067647}.bad{color:#b42318}pre{white-space:pre-wrap;background:#f2f4f7;padding:12px;border-radius:9px}</style></head><body><div class="box"><h2>Carregando ERP Gestão Profissional...</h2><div id="status">Preparando recursos profissionais.</div></div><script>
(async()=>{const st=document.getElementById('status');try{const r=await fetch('./erp-v4.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar base. HTTP '+r.status);let html=await r.text();html=html.replace(/}}async function/g,'}};async function').replace(/}}function/g,'}};function').replace(/}async function/g,'};async function').replace(/}function/g,'};function');const addon='<script src="./v5-extra.js?v='+Date.now()+'"><\/script><script src="./v5-compat.js?v='+Date.now()+'"><\/script><script src="./v6-extra.js?v='+Date.now()+'"><\/script><script src="./v6-contacts.js?v='+Date.now()+'"><\/script><script src="./v7-extra.js?v='+Date.now()+'"><\/script><script src="./v8-extra.js?v='+Date.now()+'"><\/script><script src="./v9-extra.js?v='+Date.now()+'"><\/script><script src="./v10-extra.js?v='+Date.now()+'"><\/script><script src="./v11-extra.js?v='+Date.now()+'"><\/script><script src="./v12-extra.js?v='+Date.now()+'"><\/script>';html=html.replace('</body>',addon+'</body>');const rx=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;let m;while((m=rx.exec(html))!==null){if(m[1])new Function(m[1])}st.className='ok';st.textContent='ERP pronto. Abrindo...';setTimeout(()=>{document.open();document.write(html);document.close()},120)}catch(e){st.className='bad';st.innerHTML='<b>Não foi possível abrir o ERP.</b><pre>'+String(e.message||e)+'</pre>'}})();
</script></body></html>
