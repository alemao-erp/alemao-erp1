<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico V4 - linha</title><style>body{font-family:Arial,sans-serif;background:#f5f7fa;color:#172033;padding:30px}.box{max-width:900px;margin:auto;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px}.ok{color:#067647}.bad{color:#b42318}.row{padding:10px;background:#f2f4f7;border-radius:8px;margin:8px 0;white-space:pre-wrap}</style></head><body><div class="box"><h1>Diagnóstico detalhado ERP V4</h1><p>Esta página não grava nem altera dados. Ela apenas localiza o erro de JavaScript.</p><div id="out" class="row">Analisando...</div></div><script>(async()=>{const out=document.getElementById('out');try{const html=await (await fetch('./erp-v4.html?diag='+Date.now(),{cache:'no-store'})).text();const m=html.match(/<script>([\s\S]*?)<\/script>/i);if(!m)throw new Error('Script principal não encontrado.');const js=m[1];window.addEventListener('error',ev=>{if(ev.filename&&ev.filename.startsWith('blob:')){ev.preventDefault();const lines=js.split('\n');const n=ev.lineno||0;const start=Math.max(1,n-2),end=Math.min(lines.length,n+2);let ctx='';for(let i=start;i<=end;i++)ctx+=(i===n?'>>> ':'    ')+i+': '+lines[i-1]+'\n';out.className='row bad';out.textContent='ERRO LOCALIZADO\nMensagem: '+ev.message+'\nLinha: '+n+'\nColuna: '+(ev.colno||'-')+'\n\nTrecho:\n'+ctx;}});const blob=new Blob([js+'\n//# sourceURL=v4-diagnostico.js'],{type:'text/javascript'});const s=document.createElement('script');s.src=URL.createObjectURL(blob);s.onload=()=>{setTimeout(()=>{if(!out.classList.contains('bad')){out.className='row ok';out.textContent='JavaScript carregado sem erro de sintaxe.'}},300)};document.head.appendChild(s)}catch(e){out.className='row bad';out.textContent='Falha no diagnóstico: '+e.message}})();</script></body></html>
