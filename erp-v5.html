<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alemão Produtos da Roça - ERP V5</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#172033;margin:0;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px;max-width:760px;width:calc(100% - 40px)}.ok{color:#067647}.bad{color:#b42318}pre{white-space:pre-wrap;background:#f2f4f7;padding:12px;border-radius:9px}
</style>
</head>
<body>
<div class="box"><h2>Carregando ERP V5...</h2><div id="status">Preparando o sistema.</div></div>
<script>
(async()=>{
 const st=document.getElementById('status');
 try{
   const r=await fetch('./erp-v4.html?v='+Date.now(),{cache:'no-store'});
   if(!r.ok) throw new Error('Falha ao carregar a base V4. HTTP '+r.status);
   let html=await r.text();
   html=html
     .replace(/}}async function/g,'}};async function')
     .replace(/}}function/g,'}};function')
     .replace(/}async function/g,'};async function')
     .replace(/}function/g,'};function');

   const addon='<script src="./v5-extra.js?v='+Date.now()+'"><\\/script>';
   html=html.replace('</body>',addon+'</body>');

   const scripts=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(Boolean);
   for(const code of scripts){ new Function(code); }

   st.className='ok';
   st.textContent='ERP V5 pronto. Abrindo...';
   setTimeout(()=>{document.open();document.write(html);document.close();},120);
 }catch(e){
   st.className='bad';
   st.innerHTML='<b>Não foi possível abrir a V5.</b><pre>'+String(e.message||e)+'</pre>';
 }
})();
</script>
</body>
</html>
