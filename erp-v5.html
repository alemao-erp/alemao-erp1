<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alemão Produtos da Roça - ERP V5</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#172033;margin:0;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px;max-width:760px;width:calc(100% - 40px)}.ok{color:#067647}.bad{color:#b42318}pre{white-space:pre-wrap;background:#f2f4f7;padding:12px;border-radius:9px}
</style>
</head>
<body>
<div class="box"><h2>Carregando ERP V5...</h2><div id="status">Preparando o sistema.</div></div>
<script>
(async function(){
  var st=document.getElementById('status');
  try{
    st.textContent='Carregando a base do ERP...';
    var r=await fetch('./erp-v4.html?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar a base V4. HTTP '+r.status);
    var html=await r.text();

    // Correções já confirmadas na V4.
    html=html.split('}}async function').join('}};async function');
    html=html.split('}}function').join('}};function');
    html=html.split('}async function').join('};async function');
    html=html.split('}function').join('};function');

    // Injeta as evoluções da V5 sem usar expressões regulares que quebravam o parser.
    var addon='<script src="./v5-extra.js?v='+Date.now()+'"></'+'script>';
    if(html.indexOf('</body>')>=0){
      html=html.replace('</body>',addon+'</body>');
    }else{
      html+=addon;
    }

    st.className='ok';
    st.textContent='ERP V5 pronto. Abrindo...';
    setTimeout(function(){
      document.open();
      document.write(html);
      document.close();
    },100);
  }catch(e){
    st.className='bad';
    st.innerHTML='<b>Não foi possível abrir a V5.</b><pre>'+String(e&&e.message?e.message:e)+'</pre>';
  }
})();
</script>
</body>
</html>
